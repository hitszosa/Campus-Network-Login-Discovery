name: Build and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: Linux binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - run: VERSION=${{ github.sha }} ./scripts/build.sh
      - name: Verify default binary dependencies
        run: |
          go list -deps ./cmd/cnld-agent > /tmp/cnld-deps.txt
          python3 -c 'assert not any(p.startswith("k8s.io/") for p in open("/tmp/cnld-deps.txt"))'
          ./bin/cnld-agent-linux-amd64 -version
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cnld-linux-binaries
          path: bin/
          if-no-files-found: error
          retention-days: 14

  container:
    name: OCI image and Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients
      - name: Build runnable image
        run: docker buildx build --load --build-arg VERSION=${{ github.sha }} -t cnld:ci .
      - run: ./tests/ci/prepare-broker.sh
      - run: ./tests/deploy/smoke.sh docker
      - name: Export and verify both OCI platforms
        run: |
          mkdir -p bin
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            --build-arg VERSION=${{ github.sha }} --output type=oci,dest=bin/cnld-images.oci.tar .
          python3 scripts/check-oci.py bin/cnld-images.oci.tar
          docker save cnld:ci | gzip > bin/cnld-image-amd64.docker.tar.gz
          cd bin
          sha256sum cnld-images.oci.tar cnld-image-amd64.docker.tar.gz > OCI-SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cnld-linux-oci
          path: bin/
          if-no-files-found: error
          retention-days: 14

  systemd:
    name: systemd smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients
      - run: ./tests/ci/prepare-broker.sh
      - run: ./tests/deploy/smoke.sh systemd
